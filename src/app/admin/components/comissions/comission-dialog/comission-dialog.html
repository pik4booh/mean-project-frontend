<div class="overlay" (click)="onBackdropClick()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="head">
      <h3>Créer une commission</h3>
      <button class="x" type="button" (click)="cancel.emit()">x</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="grid">
        <label class="field full">
          <span>Nom</span>
          <input formControlName="name" placeholder="Ex. : Commission par défaut" />
        </label>

        <label class="field">
          <span>Seuil (EUR)</span>
          <input type="number" formControlName="thresholdEur" />
        </label>

        <label class="field">
          <span>Sous le seuil (EUR)</span>
          <input type="number" formControlName="fixedUnderUsd" />
        </label>

        <label class="field full">
          <span>Au-dessus du seuil (%)</span>
          <input type="number" formControlName="percentAbove" />
        </label>

        <label class="check full">
          <input type="checkbox" formControlName="activateNow" />
          <span>Activer cette commission maintenant (et désactiver les autres)</span>
        </label>

        <div class="hint full">
          Exemple : si le total est inférieur au seuil, frais fixes en EUR ; sinon, pourcentage de la commande.
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="cancel.emit()">Annuler</button>
        <button type="submit" class="btn primary">Créer</button>
      </div>
    </form>
  </div>
</div>
