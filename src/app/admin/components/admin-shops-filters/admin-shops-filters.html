<div class="filters">
  <input
    [ngModel]="query.search"
    (ngModelChange)="queryChange.emit({ search: $event })"
    [ngModelOptions]="{ standalone: true }"
    placeholder="Rechercher une boutique (nom, id)..."
  />

  <select
    [ngModel]="query.categoryId"
    (ngModelChange)="queryChange.emit({ categoryId: $event })"
    [ngModelOptions]="{ standalone: true }"
  >
    <option value="all">Toutes les catégories</option>
    <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
  </select>

  <select
    [ngModel]="query.status"
    (ngModelChange)="queryChange.emit({ status: $event })"
    [ngModelOptions]="{ standalone: true }"
  >
    <option value="all">Tous les statuts</option>
    <option value="pending">En attente</option>
    <option value="active">Actif</option>
  </select>
</div>
