<section class="page" *ngIf="vm$ | async as vm">
  <div class="page-head">
    <div class="page-copy">
      <h1 class="title">Categories</h1>
      <p class="subtitle">Organisez la structure du catalogue et gardez chaque produit dans la bonne section.</p>
    </div>

    <button class="create-category-cta" type="button" (click)="openCreate()">
      <span class="create-category-cta__icon" aria-hidden="true">+</span>

      <span class="create-category-cta__copy">
        <span class="create-category-cta__label">Creer une categorie</span>
        <span class="create-category-cta__meta">Ouvrir la fenetre de configuration de categorie</span>
      </span>
    </button>
  </div>

  <app-dashboard-card title="">
    <app-categories-filters
      [query]="vm.query"
      [statuses]="vm.statuses"
      [types]="vm.types"
      (queryChange)="setQuery($event)"
    ></app-categories-filters>

    <app-categories-chips
      [categories]="vm.categories"
      (edit)="openEdit($event)"
      (toggle)="toggle($event)"
    ></app-categories-chips>
  </app-dashboard-card>

  <app-category-dialog
    *ngIf="dialogOpen"
    [mode]="dialogMode"
    [category]="editing"
    (cancel)="closeDialog()"
    (save)="onSave($event)"
  ></app-category-dialog>
</section>
