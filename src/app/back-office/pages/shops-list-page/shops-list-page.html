<section class="page" *ngIf="vm$ | async as vm">
  <div class="page-head">
    <div class="page-copy">
      <h1 class="title">Mes boutiques</h1>
      <p class="subtitle">Ouvrez une boutique existante ou créez un nouvel espace de travail pour votre équipe.</p>
    </div>

    <button class="create-shop-cta" type="button" (click)="openCreate()">
      <span class="create-shop-cta__icon">+</span>
      <span class="create-shop-cta__copy">
        <span class="create-shop-cta__label">Créer une boutique</span>
        <span class="create-shop-cta__meta">Ouvrir la fenêtre de configuration</span>
      </span>
    </button>
  </div>

  <div class="list">
    <app-shop-row *ngFor="let s of vm.shops" [shop]="$any(s)"></app-shop-row>
  </div>

  <app-shop-dialog
    *ngIf="dialogOpen"
    mode="create"
    [categories]="$any(vm.categories)"
    (cancel)="closeDialog()"
    (created)="closeDialog()"
  ></app-shop-dialog>
</section>
