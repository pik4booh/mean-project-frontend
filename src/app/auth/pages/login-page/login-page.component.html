<app-auth-form-layout
  title="Hello Mercado"
  subtitle="Bienvenue! Connectez-vous."
  titleId="login-title"
>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (apiError()) {
      <nz-alert nzType="error" [nzMessage]="apiError()" nzShowIcon></nz-alert>
    }

    

    <div class="field-group">
      <app-email-input
        id="login-email"
        label="Adresse e-mail"
        placeholder="email@gmail.com"
        autocomplete="email"
        formControlName="email"
        [invalid]="isInvalid('email')"
      ></app-email-input>
      <app-form-error
        [errors]="form.controls.email.errors"
        [touched]="form.controls.email.touched"
        [submitted]="submitted()"
      ></app-form-error>
    </div>

    <div class="field-group">
      <app-password-input
        id="login-password"
        label="Mot de passe"
        placeholder="Saisissez votre mot de passe"
        autocomplete="current-password"
        formControlName="password"
        [invalid]="isInvalid('password')"
      ></app-password-input>
      <app-form-error
        [errors]="form.controls.password.errors"
        [touched]="form.controls.password.touched"
        [submitted]="submitted()"
      ></app-form-error>
    </div>

    <app-submit-button
      label="Se connecter"
      [loading]="loading()"
      [disabled]="isSubmitDisabled()"
    ></app-submit-button>
  </form>

  <p class="auth-footer">
    Vous n'avez pas encore de compte ?
    <a routerLink="/auth/register">Créer un compte</a>
  </p>
</app-auth-form-layout>
