<app-auth-form-layout
  title="Créez votre compte"
  subtitle="Commencez Hello Mercado aujourd'hui."
  titleId="register-title"
>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (apiError()) {
      <nz-alert nzType="error" [nzMessage]="apiError()" nzShowIcon></nz-alert>
    }
    @if (apiError()) {
      <div class="api-error" role="alert">{{ apiError() }}</div>
    }
    <div class="field-group">
      <app-select-input
        id="register-role"
        label="Type"
        placeholder="Choisissez votre rôle"
        [options]="roleOptions"
        formControlName="role"
        [invalid]="isInvalid('role')"
      ></app-select-input>
      <app-form-error
        [errors]="form.controls.role.errors"
        [touched]="form.controls.role.touched"
        [submitted]="submitted()"
      ></app-form-error>
    </div>

    <div class="field-group">
      <app-text-input
        id="register-fullname"
        label="Nom complet"
        placeholder="John Doe"
        autocomplete="name"
        formControlName="fullName"
        [invalid]="isInvalid('fullName')"
      ></app-text-input>
      <app-form-error
        [errors]="form.controls.fullName.errors"
        [touched]="form.controls.fullName.touched"
        [submitted]="submitted()"
      ></app-form-error>
    </div>

    <div class="field-group">
      <app-email-input
        id="register-email"
        label="Adresse e-mail"
        placeholder="email@gmail.com"
        autocomplete="email"
        formControlName="email"
        [invalid]="isInvalid('email')"
      ></app-email-input>
      <app-form-error
        [errors]="form.controls.email.errors"
        [touched]="form.controls.email.touched"
        [submitted]="submitted()"
      ></app-form-error>
    </div>

    <div class="field-group">
      <app-text-input
        id="register-phone"
        label="Téléphone"
        placeholder="+261000000000"
        autocomplete="tel"
        inputMode="tel"
        formControlName="phone"
        [invalid]="isInvalid('phone')"
      ></app-text-input>
      <app-form-error
        [errors]="form.controls.phone.errors"
        [touched]="form.controls.phone.touched"
        [submitted]="submitted()"
      ></app-form-error>
    </div>

    <div class="field-group">
      <app-password-input
        id="register-password"
        label="Mot de passe"
        placeholder="Créez un mot de passe"
        autocomplete="new-password"
        formControlName="password"
        [invalid]="isInvalid('password')"
      ></app-password-input>
      <app-form-error
        [errors]="form.controls.password.errors"
        [touched]="form.controls.password.touched"
        [submitted]="submitted()"
      ></app-form-error>
    </div>

    <app-submit-button
      label="Créer un compte"
      [loading]="loading()"
      [disabled]="isSubmitDisabled()"
    ></app-submit-button>
  </form>

  <p class="auth-footer">
    Vous avez déjà un compte ?
    <a routerLink="/auth/login">Se connecter</a>
  </p>
</app-auth-form-layout>
