<nz-card class="search-panel">
  <div class="search-panel__top">
    <h3 class="search-panel__title">Recherche avancee</h3>
    <p class="search-panel__subtitle">Affinez les produits par mot-cle, prix, categorie et tri.</p>
  </div>

  <div class="search-panel__layout">
    <section class="search-panel__block">
      <p class="search-panel__eyebrow">Mot-cle</p>
      <app-search-keyword-input
        label="Mot-cle"
        placeholder="Essayez chargeur sans fil"
        [value]="draft().keyword"
        (valueChange)="updateKeyword($event)"
      ></app-search-keyword-input>
    </section>

    <section class="search-panel__block">
      <p class="search-panel__eyebrow">Tri</p>
      <app-sort-select
        [sort]="draft().sort"
        (sortChange)="updateSort($event)"
      ></app-sort-select>
    </section>

    <section class="search-panel__block">
      <p class="search-panel__eyebrow">Plage de prix</p>
      <app-price-range-filter
        [minPrice]="draft().minPrice"
        [maxPrice]="draft().maxPrice"
        (rangeChange)="updatePriceRange($event)"
      ></app-price-range-filter>
    </section>

    <section class="search-panel__block">
      <p class="search-panel__eyebrow">Categories</p>
      <app-category-filter
        [categories]="categories()"
        [selectedIds]="draft().categoryIds"
        (selectionChange)="updateCategories($event)"
      ></app-category-filter>
    </section>
  </div>

  <div class="search-panel__actions">
    <button nz-button nzType="link" type="button" (click)="clearAll()">
      Effacer les filtres
    </button>
    <button nz-button nzType="primary" type="button" (click)="applyFilters()">
      Appliquer les filtres
    </button>
  </div>
</nz-card>
